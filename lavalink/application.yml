# Lavalink v4 server configuration — Ironclad GM (Issue #23)
# Memory is managed via _JAVA_OPTIONS in docker-compose.yml (-Xmx256m).
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.7.0"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # HTTP source is the primary path for Ironclad GM: Lavalink streams
      # TTS, ambient, and Lyria music directly from the media-proxy service
      # (http://media-proxy:8001/assets/*) without any Python-side download.
      http: true
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      # Local filesystem source disabled; audio is served via HTTP instead
      local: false
    filters:
      volume: true
      equalizer: true
      timescale: true
      tremolo: true
      vibrato: true
      rotation: true
      karaoke: true
      lowPass: true
      channelMix: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
